name: CD - Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex : 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  # ─────────────────────────────────────────────
  # Android APK — ubuntu-latest
  # ─────────────────────────────────────────────
  release-android:
    name: Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj -p:TargetFramework=net10.0-android

      - name: Publish Android APK
        run: >
          dotnet publish PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj
          -f net10.0-android
          -c Release
          --no-restore
          /p:AndroidPackageFormats=apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: '**/*.apk'
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # iOS .app (Simulator) — macos-latest
  # Note: la signature pour device réel requiert
  # des secrets Apple (certificat + provisioning).
  # ─────────────────────────────────────────────
  release-ios:
    name: Release iOS (Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj -p:TargetFramework=net10.0-ios

      - name: Publish iOS
        run: >
          dotnet publish PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj
          -f net10.0-ios
          -c Release
          --no-restore
          /p:BuildForDevice=false

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.ref_name }}
          path: '**/*.app'
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # macOS Catalyst .app — macos-latest
  # ─────────────────────────────────────────────
  release-maccatalyst:
    name: Release macOS Catalyst
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install MAUI macOS workload
        run: dotnet workload install maui-maccatalyst

      - name: Restore
        run: dotnet restore PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj -p:TargetFramework=net10.0-maccatalyst

      - name: Publish macOS Catalyst
        run: >
          dotnet publish PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj
          -f net10.0-maccatalyst
          -c Release
          --no-restore

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: maccatalyst-${{ github.ref_name }}
          path: '**/*.app'
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # Windows .exe — windows-latest
  # ─────────────────────────────────────────────
  release-windows:
    name: Release Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj -p:TargetFramework=net10.0-windows10.0.19041.0

      - name: Publish Windows
        run: >
          dotnet publish PolyPilotMauiDemoTest/PolyPilotMauiDemoTest.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          --no-restore
          /p:WindowsPackageType=None

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: '**/publish/**/*.exe'
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # GitHub Release — regroupe tous les artifacts
  # ─────────────────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ release-android, release-ios, release-maccatalyst, release-windows ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-artifacts/**/*
